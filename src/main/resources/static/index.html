<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sneaker Spa — Premium Sneaker Care</title>

  <!-- Google Fonts: Space Grotesk & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            display: ["'Space Grotesk'", "system-ui", "sans-serif"],
            body: ["'Inter'", "system-ui", "sans-serif"],
          },
          colors: {
            border: "hsl(var(--border))",
            input: "hsl(var(--input))",
            ring: "hsl(var(--ring))",
            background: "hsl(var(--background))",
            foreground: "hsl(var(--foreground))",
            primary: {
              DEFAULT: "hsl(var(--primary))",
              foreground: "hsl(var(--primary-foreground))",
            },
            secondary: {
              DEFAULT: "hsl(var(--secondary))",
              foreground: "hsl(var(--secondary-foreground))",
            },
            destructive: {
              DEFAULT: "hsl(var(--destructive))",
              foreground: "hsl(var(--destructive-foreground))",
            },
            muted: {
              DEFAULT: "hsl(var(--muted))",
              foreground: "hsl(var(--muted-foreground))",
            },
            accent: {
              DEFAULT: "hsl(var(--accent))",
              foreground: "hsl(var(--accent-foreground))",
            },
            popover: {
              DEFAULT: "hsl(var(--popover))",
              foreground: "hsl(var(--popover-foreground))",
            },
            card: {
              DEFAULT: "hsl(var(--card))",
              foreground: "hsl(var(--card-foreground))",
            },
          },
          keyframes: {
            "fade-in": {
              "0%": { opacity: "0", transform: "translateY(10px)" },
              "100%": { opacity: "1", transform: "translateY(0)" },
            },
            "fade-in-up": {
              "0%": { opacity: "0", transform: "translateY(20px)" },
              "100%": { opacity: "1", transform: "translateY(0)" },
            },
            "slide-up": {
              "0%": { transform: "translateY(100%)" },
              "100%": { transform: "translateY(0)" },
            },
            "pulse-glow": {
              "0%, 100%": { boxShadow: "0 0 20px hsl(192 100% 50% / 0.2)" },
              "50%": { boxShadow: "0 0 40px hsl(192 100% 50% / 0.4)" },
            },
            shimmer: {
              "0%": { backgroundPosition: "-200% 0" },
              "100%": { backgroundPosition: "200% 0" },
            },
          },
          animation: {
            "fade-in": "fade-in 0.5s ease-out forwards",
            "fade-in-up": "fade-in-up 0.6s ease-out forwards",
            "slide-up": "slide-up 0.4s ease-out",
            "pulse-glow": "pulse-glow 2s ease-in-out infinite",
            shimmer: "shimmer 2s linear infinite",
          },
        },
      },
    };
  </script>

  <!-- Lucide Icons via CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="bg-background text-foreground min-h-screen selection:bg-primary/30">

  <!-- Main SPA View Mount -->
  <div id="app" class="relative"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 w-full max-w-sm px-4 pointer-events-none"></div>

  <!-- Modal / Auth Drawer Mount -->
  <div id="modal-container" class="fixed inset-0 z-50 pointer-events-none"></div>

  <!-- Application Logic Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
